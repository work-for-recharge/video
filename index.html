<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work For Recharge - Mini App</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-color: #2f80ed;
            --text-main: #ffffff;
            --text-sub: #8292a6;
            --success: #27ae60;
            --warning: #f2994a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Top Header Section */
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #242b35;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e2530, #151a24);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #2f80ed40;
            box-shadow: 0 0 10px rgba(47, 128, 237, 0.2);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .balance-amount {
            color: #f2c94c;
        }

        /* Instruction Area */
        .instruction {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 95%;
        }

        /* Grid View for Video Buttons */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .video-btn {
            background: var(--card-bg);
            border: 1px solid #242b35;
            padding: 15px 10px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .video-btn:active {
            transform: scale(0.95);
        }

        .video-btn.completed {
            border-color: var(--success);
            background: rgba(39, 174, 96, 0.05);
        }

        .video-btn.completed .status-icon {
            color: var(--success);
        }

        .status-icon {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* Active Video Overlay Panel */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 13, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .video-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--accent-color);
        }

        .overlay-msg {
            font-size: 16px;
            text-align: center;
            margin-bottom: 30px;
            color: var(--text-sub);
            padding: 0 20px;
        }

        .close-btn {
            background: #eb5757;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Bottom Action Buttons */
        .action-area {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .withdraw-btn {
            background: linear-gradient(90deg, #2f80ed, #0056b3);
            color: white;
            box-shadow: 0 4px 15px rgba(47, 128, 237, 0.4);
        }

        .withdraw-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="logo-area">
            <span class="logo-text">WFR App</span>
        </div>
        <div class="balance-card">
            <span>💰 Balance:</span>
            <span id="user-balance" class="balance-amount">200</span>
        </div>
    </div>

    <!-- Instruction -->
    <div class="instruction" id="info-box">
        যেকোনো লিংকে ক্লিক করে ১৫ সেকেন্ড বিজ্ঞাপনটি দেখুন। সম্পূর্ণ না দেখলে পয়েন্ট যোগ হবে না।
    </div>

    <!-- Video Grid -->
    <div class="grid-container" id="video-grid">
        <!-- Buttons generated dynamically -->
    </div>

    <!-- Bottom Action -->
    <div class="action-area">
        <button class="main-btn withdraw-btn" onclick="handleWithdraw()">📱 Mobile Recharge</button>
    </div>

    <!-- Video Ads Overlay -->
    <div class="video-overlay" id="video-panel">
        <div class="timer-circle" id="timer-display">15</div>
        <div class="overlay-msg" id="overlay-text">বিজ্ঞাপনটি লোড হচ্ছে... এটি ১৫ সেকেন্ড দেখুন। মাঝপথে কেটে দিলে পয়েন্ট পাবেন না।</div>
        <button class="close-btn" onclick="cancelVideo()">❌ কাজ বাতিল করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        let userBalance = 200; 
        let activeLink = null;
        let countdown = 15;
        let timerId = null;
        let clickTracker = JSON.parse(localStorage.getItem('wfr_clicks')) || {};

        function initApp() {
            document.getElementById('user-balance').innerText = userBalance;
            renderGrid();
        }

        function renderGrid() {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                let clicks = clickTracker[i] || 0;
                let btn = document.createElement('button');
                btn.className = 'video-btn' + (clicks >= 3 ? ' completed' : '');
                
                let title = document.createElement('span');
                title.innerText = `Link ${i}`;
                
                let status = document.createElement('span');
                status.className = 'status-icon';
                status.innerText = clicks >= 3 ? '3/3 ✅' : `${clicks}/3`;
                
                btn.appendChild(title);
                btn.appendChild(status);
                
                if (clicks < 3) {
                    btn.onclick = () => startVideoWork(i);
                } else {
                    btn.onclick = () => alert(`লিঙ্ক ${i} এর আজকের কাজের লিমিট শেষ!`);
                }
                grid.appendChild(btn);
            }
        }

        function startVideoWork(linkNum) {
            activeLink = linkNum;
            countdown = 15;
            document.getElementById('timer-display').innerText = countdown;
            document.getElementById('video-panel').classList.add('active');
            
            let targetUrl = linkNum === 1 ? "https://github.io" : `https://github.io{linkNum}.html`;
            window.open(targetUrl, '_blank');

            timerId = setInterval(() => {
                countdown--;
                document.getElementById('timer-display').innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(timerId);
                    completeVideoWork();
                }
            }, 1000);
        }

        function cancelVideo() {
            clearInterval(timerId);
            document.getElementById('video-panel').classList.remove('active');
            tg.showPopup({
                title: 'কাজ বাতিল',
                message: 'আপনি সময় শেষ হওয়ার আগেই কেটে দিয়েছেন, তাই কোনো পয়েন্ট যোগ হয়নি!',
                buttons: [{type: 'ok'}]
            });
        }

        function completeVideoWork() {
            document.getElementById('video-panel').classList.remove('active');
            clickTracker[activeLink] = (clickTracker[activeLink] || 0) + 1;
            localStorage.setItem('wfr_clicks', JSON.stringify(clickTracker));
            userBalance += 5;
