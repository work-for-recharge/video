<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work For Recharge</title>
    <!-- Telegram WebApp Script -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-color: #2f80ed;
            --text-main: #ffffff;
            --text-sub: #8292a6;
            --success: #27ae60;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #242b35;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e2530, #151a24);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #2f80ed40;
            font-weight: 600;
        }

        .instruction {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 95%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .video-btn {
            background: var(--card-bg);
            border: 1px solid #242b35;
            padding: 15px 10px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .status-icon {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* সলিড ইন-অ্যাপ ভিডিও দেখার ও পপ-আপ স্ক্রিনস্টাইল */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 13, 0.98);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .video-overlay.active {
            display: flex;
        }

        .timer-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid var(--accent-color);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .close-btn {
            background: #eb5757;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-area {
            width: 100%;
            max-width: 400px;
        }

        .withdraw-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(90deg, #2f80ed, #0056b3);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight:700; color:var(--accent-color);">WFR APP</span>
        <div class="balance-card">💰 Balance: <span id="user-balance" style="color:#f2c94c;">200</span></div>
    </div>

    <div class="instruction">
        যেকোনো লিংকে ক্লিক করে ১৫ সেকেন্ড কাজ সম্পন্ন করুন। মাঝপথে কাটলে পয়েন্ট পাবেন না।
    </div>

    <!-- ১০টি বোতাম তালিকা -->
    <div class="grid-container">
        <button class="video-btn" onclick="startInAppWork(1)"><span>Link 1</span><span class="status-icon" id="status-1">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(2)"><span>Link 2</span><span class="status-icon" id="status-2">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(3)"><span>Link 3</span><span class="status-icon" id="status-3">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(4)"><span>Link 4</span><span class="status-icon" id="status-4">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(5)"><span>Link 5</span><span class="status-icon" id="status-5">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(6)"><span>Link 6</span><span class="status-icon" id="status-6">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(7)"><span>Link 7</span><span class="status-icon" id="status-7">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(8)"><span>Link 8</span><span class="status-icon" id="status-8">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(9)"><span>Link 9</span><span class="status-icon" id="status-9">0/3</span></button>
        <button class="video-btn" onclick="startInAppWork(10)"><span>Link 10</span><span class="status-icon" id="status-10">0/3</span></button>
    </div>

    <div class="action-area">
        <button class="withdraw-btn" onclick="handleWithdraw()">📱 Mobile Recharge</button>
    </div>

    <!-- ইন-অ্যাপ পপ-আপ ইন্টারফেস যা সরাসরি টেলিগ্রাম স্ক্রিনের ভেতরে কাজ করবে -->
    <div class="video-overlay" id="video-panel">
        <div class="timer-circle" id="timer-display">15</div>
        <div style="text-align:center; margin-bottom:30px; color:var(--text-sub); padding:0 20px;">
            বিজ্ঞাপনটি লোড হচ্ছে... এটি ১৫ সেকেন্ড দেখুন। মাঝপথে কেটে দিলে পয়েন্ট পাবেন না।
        </div>
        <button class="close-btn" onclick="cancelVideo()">❌ কাজ বাতিল করুন</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.expand) { tg.expand(); }

        let userBalance = 200;
        let activeLink = null;
        let countdown = 15;
        let timerId = null;
        let clickTracker = JSON.parse(localStorage.getItem('wfr_clicks')) || {};

        function initApp() {
            document.getElementById('user-balance').innerText = userBalance;
            for (let i = 1; i <= 10; i++) {
                let clicks = clickTracker[i] || 0;
                let element = document.getElementById(`status-${i}`);
                if(element) {
                    element.innerText = clicks >= 3 ? '3/3 ✅' : `${clicks}/3`;
                }
            }
        }

        function startInAppWork(linkNum) {
            let clicks = clickTracker[linkNum] || 0;
            if (clicks >= 3) {
                if (tg.showPopup) { tg.showPopup({ message: `লিঙ্ক ${linkNum} এর আজকের লিমিট শেষ!` }); }
                return;
            }
            activeLink = linkNum;
            countdown = 15;
            document.getElementById('timer-display').innerText = countdown;
            document.getElementById('video-panel').classList.add('active');
            
            // ইন-অ্যাপ টাইমার ইঞ্জিন রান করা হলো
            timerId = setInterval(() => {
                countdown--;
                document.getElementById('timer-display').innerText = countdown;
                if (countdown <= 0) {
                    clearInterval(timerId);
                    completeVideoWork();
                }
            }, 1000);
            
            // ব্যাকগ্রাউন্ডে অরিজিনাল ভিডিও ফাইলটি ইন-অ্যাপ মেমোরিতে ট্র্যাক করা হলো
            let targetUrl = `https://github.io{linkNum}.html`;
            try {
                tg.openLink(targetUrl);
            } catch(e) {
                window.open(targetUrl, '_blank');
            }
        }

        function cancelVideo() {
            clearInterval(timerId);
            document.getElementById('video-panel').classList.remove('active');
            if (tg.showPopup) {
                tg.showPopup({ title: 'কাজ বাতিল', message: 'আপনি সময় শেষ হওয়ার আগেই কেটে দিয়েছেন, পয়েন্ট যোগ হয়নি!' });
            }
        }

        function completeVideoWork() {
            document.getElementById('video-panel').classList.remove('active');
            clickTracker[activeLink] = (clickTracker[activeLink] || 0) + 1;
            localStorage.setItem('wfr_clicks', JSON.stringify(clickTracker));
            userBalance += 5;
            initApp();
            
            if (tg.showPopup) {
                tg.showPopup({ title: 'অভিনন্দন!', message: `লিঙ্ক ${activeLink} এর কাজ সম্পন্ন হয়েছে। আপনার ব্যালেন্সে ৫ পয়েন্ট যোগ হলো!` });
            }
        }

        function handleWithdraw() {
            if (userBalance < 1000) {
                if (tg.showPopup) {
                    tg.showPopup({
                        title: 'ব্যালেন্স কম!',
                        message: `মোবাইল রিচার্জের জন্য ন্যূনতম ১০০০ পয়েন্ট প্রয়োজন। আপনার আছে: ${userBalance} পয়েন্ট।`,
                        buttons: [{type: 'close', text: 'ঠিক আছে'}]
                    });
                }
            } else {
                if (tg.showPopup) { tg.showPopup({ title: 'আবেদন সফল', message: `আপনার রিচার্জ রিকোয়েস্টটি সাবমিট করতে বটের ইনবক্সে গিয়ে রিকোয়েস্ট দিন।` }); }
                if (tg.close) { tg.close(); }
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
