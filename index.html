<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work For Recharge - Mini App</title>
    <!-- Telegram WebApp JS Script version 1 to instantly refresh cache -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-color: #2f80ed;
            --text-main: #ffffff;
            --text-sub: #8292a6;
            --success: #27ae60;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #242b35;
        }
        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-color);
            text-transform: uppercase;
        }
        .balance-card {
            background: linear-gradient(135deg, #1e2530, #151a24);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #2f80ed40;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .balance-amount {
            color: #f2c94c;
        }
        .instruction {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 95%;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }
        .video-btn {
            background: var(--card-bg);
            border: 1px solid #242b35;
            padding: 15px 10px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .status-icon {
            font-size: 11px;
            color: var(--text-sub);
        }
        .action-area {
            width: 100%;
            max-width: 400px;
            margin-top: auto;
            padding-bottom: 10px;
        }
        .withdraw-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(90deg, #2f80ed, #0056b3);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="logo-text">WFR App</span>
        <div class="balance-card">
            <span>💰 Balance:</span>
            <span id="user-balance" class="balance-amount">200</span>
        </div>
    </div>

    <div class="instruction">
        যেকোনো লিংকে ক্লিক করে বিজ্ঞাপনটি দেখুন। সম্পূর্ণ দেখলে পয়েন্ট যোগ হবে।
    </div>

    <div class="grid-container">
        <button class="video-btn" onclick="startVideoWork(1)"><span>Link 1</span><span class="status-icon" id="status-1">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(2)"><span>Link 2</span><span class="status-icon" id="status-2">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(3)"><span>Link 3</span><span class="status-icon" id="status-3">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(4)"><span>Link 4</span><span class="status-icon" id="status-4">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(5)"><span>Link 5</span><span class="status-icon" id="status-5">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(6)"><span>Link 6</span><span class="status-icon" id="status-6">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(7)"><span>Link 7</span><span class="status-icon" id="status-7">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(8)"><span>Link 8</span><span class="status-icon" id="status-8">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(9)"><span>Link 9</span><span class="status-icon" id="status-9">0/3</span></button>
        <button class="video-btn" onclick="startVideoWork(10)"><span>Link 10</span><span class="status-icon" id="status-10">0/3</span></button>
    </div>

    <div class="action-area">
        <button class="withdraw-btn" onclick="handleWithdraw()">📱 Mobile Recharge</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.expand) { tg.expand(); }

        let userBalance = 200;
        let clickTracker = JSON.parse(localStorage.getItem('wfr_clicks')) || {};

        function initApp() {
            document.getElementById('user-balance').innerText = userBalance;
            for (let i = 1; i <= 10; i++) {
                let clicks = clickTracker[i] || 0;
                let element = document.getElementById(`status-${i}`);
                if(element) {
                    element.innerText = clicks >= 3 ? '3/3 ✅' : `${clicks}/3`;
                }
            }
        }

        function startVideoWork(linkNum) {
            let clicks = clickTracker[linkNum] || 0;
            if (clicks >= 3) {
                if (tg.showPopup) {
                    tg.showPopup({ title: 'সীমাবদ্ধতা!', message: `লিঙ্ক ${linkNum} এর আজকের কাজের লিমিট শেষ!` });
                } else {
                    alert(`লিঙ্ক ${linkNum} এর আজকের কাজের লিমিট শেষ!`);
                }
                return;
            }
            
            let targetUrl = `https://github.io{linkNum}.html`;
            
            // পয়েন্ট ও ক্লিক ট্র্যাকিং আপডেট
            clickTracker[linkNum] = clicks + 1;
            localStorage.setItem('wfr_clicks', JSON.stringify(clickTracker));
            userBalance += 5;
            initApp();

            // টেলিগ্রাম ইন-অ্যাপ ওপেনার দিয়ে সরাসরি ভিডিও ডিরেক্টরি লোড
            if (tg.openLink) {
                tg.openLink(targetUrl);
            } else {
                window.open(targetUrl, '_blank');
            }
        }

        function handleWithdraw() {
            if (userBalance < 1000) {
                if (tg.showPopup) {
                    tg.showPopup({
                        title: 'ব্যালেন্স কম!',
                        message: `মোবাইল রিচার্জের জন্য ন্যূনতম ১০০০ পয়েন্ট প্রয়োজন। আপনার আছে: ${userBalance} পয়েন্ট।`,
                        buttons: [{type: 'close', text: 'ঠিক আছে'}]
                    });
                } else {
                    alert(`ব্যালেন্স কম! ন্যূনতম ১০০০ পয়েন্ট প্রয়োজন।`);
                }
            } else {
                if (tg.showPopup) {
                    tg.showPopup({
                        title: 'আবেদন সফল',
                        message: `আপনার রিচার্জ রিকোয়েস্টটি সাবমিট করতে বটের ইনবক্সে গিয়ে রিকোয়েস্ট দিন।`,
                        buttons: [{type: 'ok'}]
                    });
                }
                if (tg.close) { tg.close(); }
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
