<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work For Recharge</title>
    <!-- Telegram WebApp Core Script -->
    <script src="https://telegram.org"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a24;
            --accent-color: #2f80ed;
            --text-main: #ffffff;
            --text-sub: #8292a6;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            margin-bottom: 20px;
            border-bottom: 1px solid #242b35;
        }

        .balance-card {
            background: linear-gradient(135deg, #1e2530, #151a24);
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #2f80ed40;
            font-weight: 600;
        }

        .instruction {
            text-align: center;
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 10px;
            border-radius: 10px;
            width: 95%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 25px;
        }

        .video-btn {
            background: var(--card-bg);
            border: 1px solid #242b35;
            padding: 15px 10px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .status-icon {
            font-size: 11px;
            color: var(--text-sub);
        }

        .withdraw-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            background: linear-gradient(90deg, #2f80ed, #0056b3);
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <span style="font-weight:700; color:var(--accent-color);">WFR APP</span>
        <div class="balance-card">💰 Balance: <span id="user-balance" style="color:#f2c94c;">200</span></div>
    </div>

    <div class="instruction">
        যেকোনো লিংকে ক্লিক করে ১৫ সেকেন্ড বিজ্ঞাপনটি দেখুন। সম্পূর্ণ না দেখলে পয়েন্ট যোগ হবে না।
    </div>

    <div class="grid-container">
        <button class="video-btn" onclick="startWork(1)"><span>Link 1</span><span class="status-icon" id="status-1">0/3</span></button>
        <button class="video-btn" onclick="startWork(2)"><span>Link 2</span><span class="status-icon" id="status-2">0/3</span></button>
        <button class="video-btn" onclick="startWork(3)"><span>Link 3</span><span class="status-icon" id="status-3">0/3</span></button>
        <button class="video-btn" onclick="startWork(4)"><span>Link 4</span><span class="status-icon" id="status-4">0/3</span></button>
        <button class="video-btn" onclick="startWork(5)"><span>Link 5</span><span class="status-icon" id="status-5">0/3</span></button>
        <button class="video-btn" onclick="startWork(6)"><span>Link 6</span><span class="status-icon" id="status-6">0/3</span></button>
        <button class="video-btn" onclick="startWork(7)"><span>Link 7</span><span class="status-icon" id="status-7">0/3</span></button>
        <button class="video-btn" onclick="startWork(8)"><span>Link 8</span><span class="status-icon" id="status-8">0/3</span></button>
        <button class="video-btn" onclick="startWork(9)"><span>Link 9</span><span class="status-icon" id="status-9">0/3</span></button>
        <button class="video-btn" onclick="startWork(10)"><span>Link 10</span><span class="status-icon" id="status-10">0/3</span></button>
    </div>

    <div style="width: 100%; max-width: 400px;">
        <button class="withdraw-btn" onclick="handleWithdraw()">📱 Mobile Recharge</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg.expand) { tg.expand(); }

        let userBalance = 200;
        let clickTracker = JSON.parse(localStorage.getItem('wfr_clicks')) || {};

        // 📢 আপনার স্ক্রিনশট দুটি থেকে প্রতিটি অক্ষর মিলিয়ে ১০টি একদম সঠিক স্মার্ট লিঙ্ক সেট করা হলো:
        const smartLinks = {
            1: "https://www.profitableratecpmnetwork.com/a9dw356q8?key=4447f4a89eef6d7da6d76ad07cc68eb6",
            2: "https://www.profitableratecpmnetwork.com/g4qj6biyu?key=22dff596c4f72f06ac1e022a9dec10c4",
            3: "https://www.profitableratecpmnetwork.com/dn7q4ncr3d?key=bd428d1db63c7f7c7745568dd0727a38",
            4: "https://www.profitableratecpmnetwork.com/z8aq7rv8d?key=4f0273ed46fd9bab7e7f94ac75f4b7b9",
            5: "https://www.profitableratecpmnetwork.com/pis3rsju9s?key=bbfcb9b8f205773b93f339e2b59aa1d5",
            6: "https://www.profitableratecpmnetwork.com/hn9w45xh?key=ecc75969c761eb8817b8fa681b0a77ef",
            7: "https://www.profitableratecpmnetwork.com/zzg47dbt?key=feab862e5a6a16b009a5aeb4dc8fd04f",
            8: "https://www.profitableratecpmnetwork.com/bs7c5m3j?key=82adfddaea13958a5295ff496710ae96",
            9: "https://www.profitableratecpmnetwork.com/wce644fe?key=78d3ecdbb5d3b4f2b53fe47b7d7e8fce",
            10: "https://www.profitableratecpmnetwork.com/jgb8e8m2u?key=072e9373fa459538c8faca6da7a26b4a"
        };

        function initApp() {
            document.getElementById('user-balance').innerText = userBalance;
            for (let i = 1; i <= 10; i++) {
                let clicks = clickTracker[i] || 0;
                let element = document.getElementById(`status-${i}`);
                if(element) {
                    element.innerText = clicks >= 3 ? '3/3 ✅' : `${clicks}/3`;
                }
            }
        }

        function startWork(linkNum) {
            let clicks = clickTracker[linkNum] || 0;
            if (clicks >= 3) {
                if (tg.showPopup) { tg.showPopup({ message: `লিঙ্ক ${linkNum} এর লিমিট শেষ!` }); }
                return;
            }
            
            let targetUrl = smartLinks[linkNum];
            
            clickTracker[linkNum] = clicks + 1;
            localStorage.setItem('wfr_clicks', JSON.stringify(clickTracker));
            userBalance += 5;
            initApp();

            if (tg.openLink) {
                tg.openLink(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function handleWithdraw() {
            if (userBalance < 1000) {
                if (tg.showPopup) {
                    tg.showPopup({
                        title: 'ব্যালেন্স কম!',
                        message: `মোবাইল রিচার্জের জন্য ন্যূনতম ১০০০ পয়েন্ট প্রয়োজন। আপনার বর্তমান ব্যালেন্স: ${userBalance} পয়েন্ট।`,
                        buttons: [{type: 'close', text: 'ঠিক আছে'}]
                    });
                }
            } else {
                if (tg.showPopup) { 
                    tg.showPopup({ title: 'আবেদন সফল', message: `আপনার রিচার্জ রিকোয়েস্টটি সাবমিট করতে বটের ইনবক্সে ব্যাক যান ভাই।` }); 
                }
                tg.sendData(JSON.stringify({action: 'withdraw', current_balance: userBalance}));
                if (tg.close) { tg.close(); }
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
